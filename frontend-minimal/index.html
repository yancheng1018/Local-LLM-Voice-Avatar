<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local-LLM-Voice-Avatar · Minimal</title>
    <!-- Cubism Core 必须在本模块脚本之前以全局形式加载（window.Live2DCubismCore）。
         复用后端由原 frontend/ 挂载暴露的 /libs（server.py 已把 frontend/ 挂在 /）。 -->
    <script src="/libs/live2dcubismcore.min.js"></script>
  </head>
  <body>
    <div id="stage"></div>
    <div id="overlay">
      <div id="status-bar">
        <span id="conn-dot" class="dot off"></span>
        <span id="status-text">连接中…</span>
        <select id="char-select" title="切换角色（含 Live2D / Spine 模型）"></select>
        <select id="model-select" title="仅切换当前角色的 Live2D 外观；角色、人设和聊天记录保持不变" disabled></select>
        <button id="touch-debug-btn" title="在模型上叠加显示触摸互动区域与对应动作（框随模型动作实时移动）。仅 Live2D 模型有效">🔍 热区：关</button>
        <button id="debug-panel-btn" title="仿 l2d.su 左侧调试栏：模型显示/动作/参数/部件实时调试。仅 Live2D 模型有效">🧪 调试栏：关</button>
        <button id="reset-model-btn" title="停止当前动作并让 Live2D 模型回到初始待机动作；不影响角色和对话">↺ 复位模型</button>
        <button id="history-toggle-btn" title="开启后：刷新页面自动恢复上次对话，LLM 记忆连续。
注意：历史越长 LLM 上下文越大，语音合成会明显变慢（GPU 争用）">🕘 历史：关</button>
        <button id="new-chat-btn" title="开启新对话（清空聊天记录与 LLM 记忆）" disabled>✚ 新对话</button>
      </div>
      <div id="bottom-area">
        <div id="subtitles"></div>
        <div id="input-row">
          <button id="interrupt-btn" title="打断当前回复" disabled>⏹ 打断</button>
          <input id="text-input" type="text" placeholder="输入文字开始对话…" autocomplete="off" />
          <button id="send-btn">发送</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
